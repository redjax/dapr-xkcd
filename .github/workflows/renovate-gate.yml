---
name: Renovate Gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to validate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: renovate-gate-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      container-changed: ${{ steps.filter.outputs.container-changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}
          fetch-depth: 0
      - name: Detect container and application changes
        id: filter
        env:
          BEFORE: ${{ github.event.pull_request.base.sha }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail


          if [[ -z "${BEFORE}" || -z "${AFTER}" ]]; then
            printf 'No pull-request diff available; treating container as changed.\n' >&2
            printf 'container-changed=true\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi


          changed="$(git diff --name-only "${BEFORE}" "${AFTER}" || true)"

          printf 'Changed files:\n%s\n' "${changed:-<none>}"

          container_changed=false

          if printf '%s\n' "${changed}" |
             grep -Eq '^(\.containers/|\.github/workflows/|cmd/|internal/|go\.(mod|sum)$)'; then
            container_changed=true
          fi

          printf 'Container changed: %s\n' "${container_changed}"
          printf 'container-changed=%s\n' "${container_changed}" >> "${GITHUB_OUTPUT}"

  container:
    name: Container build
    needs: changes
    if: needs.changes.outputs.container-changed == 'true'
    permissions:
      contents: read
      packages: write
    uses: redjax/pipelinetemplates/.github/workflows/docker-build.yml@main
    with:
      context: .
      dockerfile: .containers/Dockerfile
      target: runtime
      tags: ghcr.io/redjax/dapr-xkcd:renovate-gate
      platforms: linux/amd64
      build-args: |
        GO_IMAGE=${{ vars.GO_IMAGE || 'golang:1.27-alpine' }}
      labels: |
        org.opencontainers.image.title=dapr-xkcd
        org.opencontainers.image.description=Self-hosted XKCD archive and viewer
        org.opencontainers.image.source=https://github.com/redjax/dapr-xkcd
        org.opencontainers.image.revision=${{ github.sha }}
      pull: true
      cache-from: type=gha,scope=dapr-xkcd-api
      cache-to: type=gha,mode=max,scope=dapr-xkcd-api
      publish: false
      registry: ghcr.io

  renovate-gate:
    name: Renovate compatibility gate
    needs: [changes, container]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Renovate gate
        env:
          CONTAINER_CHANGED: ${{ needs.changes.outputs.container-changed }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          set -euo pipefail

          printf 'Container changed: %s\n' "${CONTAINER_CHANGED}"
          printf 'Container build result: %s\n' "${CONTAINER_RESULT}"

          if [[ "${CONTAINER_CHANGED}" == "false" ]]; then
            printf 'No relevant files changed; build was intentionally skipped.\n'
            exit 0
          fi

          if [[ "${CONTAINER_RESULT}" != "success" ]]; then
            printf 'Container build result: %s\n' "${CONTAINER_RESULT}" >&2
            exit 1
          fi

          printf 'Container build succeeded.\n'

          {
            printf '### Renovate gate\n\n'
            printf -- '- Container changed: `%s`\n' "${CONTAINER_CHANGED}"
            printf -- '- Container build result: `%s`\n' "${CONTAINER_RESULT}"
            printf -- '- Gate conclusion: `success`\n'
          } >> "${GITHUB_STEP_SUMMARY}"
