---
name: Build API Container

on:
  push:
    branches:
      - main
    paths:
      - ".containers/Dockerfile"
      - ".dockerignore"
      - "go.mod"
      - "go.sum"
      - "cmd/api/**"
      - "internal/**"
      - ".github/workflows/docker.yml"

      - "!**/*.md"
      - "!**/*_test.go"

  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built image to GHCR
        required: false
        type: boolean
        default: false

      notify_komodo:
        description: Send Komodo webhook
        required: false
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare image metadata
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.image.outputs.tags }}
      publish: ${{ steps.image.outputs.publish }}
    steps:
      - name: Prepare image tags and publishing decision
        id: image
        shell: bash
        env:
          IMAGE: ghcr.io/redjax/dapr-xkcd
          MANUAL_PUBLISH: ${{ inputs.publish == true }}
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA:0:7}"

          publish=false
          tags=("${IMAGE}:sha-${short_sha}")

          ## Publish automatically after a qualifying push to main.
          if [[ "${GITHUB_EVENT_NAME}" == "push" \
             && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            publish=true

          ## Manual runs publish only when explicitly requested.
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" \
               && "${MANUAL_PUBLISH}" == "true" ]]; then
            publish=true
          fi

          ## Only published main builds update latest.
          if [[ "${publish}" == "true" \
             && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            tags+=("${IMAGE}:latest")
          fi

          ## Manually published version tags also get a version image tag.
          if [[ "${publish}" == "true" \
             && "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/}"

            if [[ ! "${version}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              printf 'Invalid Docker image tag: %s\n' "${version}" >&2
              exit 1
            fi

            tags+=("${IMAGE}:${version}")
          fi

          printf 'Event: %s\n' "${GITHUB_EVENT_NAME}"
          printf 'Ref: %s\n' "${GITHUB_REF}"
          printf 'Short SHA: %s\n' "${short_sha}"
          printf 'Publish: %s\n' "${publish}"
          printf 'Image tags:\n'
          printf '  %s\n' "${tags[@]}"

          {
            printf 'publish=%s\n' "${publish}"
            printf 'tags<<IMAGE_TAGS\n'
            printf '%s\n' "${tags[@]}"
            printf 'IMAGE_TAGS\n'
          } >> "${GITHUB_OUTPUT}"

          {
            printf '### Container build decision\n\n'
            printf -- '- Event: `%s`\n' "${GITHUB_EVENT_NAME}"
            printf -- '- Ref: `%s`\n' "${GITHUB_REF}"
            printf -- '- Short SHA: `%s`\n' "${short_sha}"
            printf -- '- Publish: `%s`\n' "${publish}"
            printf '\nImage tags:\n\n'
            printf '```text\n'
            printf '%s\n' "${tags[@]}"
            printf '```\n'
          } >> "${GITHUB_STEP_SUMMARY}"

  docker:
    name: Build API image
    needs: prepare
    permissions:
      contents: read
      packages: write
    uses: redjax/pipelinetemplates/.github/workflows/docker-build.yml@main
    with:
      context: .
      dockerfile: .containers/Dockerfile
      target: runtime
      tags: ${{ needs.prepare.outputs.tags }}
      platforms: linux/amd64,linux/arm64
      build-args: |
        GO_IMAGE=${{ vars.GO_IMAGE || 'golang:1.27-alpine' }}
      labels: |
        org.opencontainers.image.title=dapr-xkcd
        org.opencontainers.image.description=Self-hosted XKCD archive and viewer
        org.opencontainers.image.source=https://github.com/redjax/dapr-xkcd
        org.opencontainers.image.revision=${{ github.sha }}
      pull: true
      cache-from: type=gha,scope=dapr-xkcd-api
      cache-to: type=gha,mode=max,scope=dapr-xkcd-api
      publish: ${{ needs.prepare.outputs.publish == 'true' }}
      registry: ghcr.io

  deploy-komodo:
    name: Notify Komodo
    needs: [prepare, docker]
    if: >-
      ${{
        needs.prepare.outputs.publish == 'true' &&
        github.ref == 'refs/heads/main' &&
        (
          github.event_name == 'push' ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.notify_komodo == true
          )
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Komodo deployment
        id: notify
        continue-on-error: true
        shell: bash
        env:
          KOMODO_DEPLOY_WEBHOOK: ${{ secrets.KOMODO_WEBHOOK_URL }}
          KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          report_warning() {
            local detail="$1"

            echo "::warning::${detail}"

            {
              echo "result=warning"
              echo "detail=${detail}"
            } >> "${GITHUB_OUTPUT}"
          }

          if [[ -z "${KOMODO_DEPLOY_WEBHOOK}" \
             || -z "${KOMODO_WEBHOOK_SECRET}" ]]; then
            report_warning "Komodo webhook URL or secret is missing."
            exit 1
          fi

          ## Construct a GitHub-style push payload.
          #  The notification job only runs for published main builds.
          payload="$(jq -cn \
            --arg ref "${GITHUB_REF}" \
            --arg after "${GITHUB_SHA}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg server_url "${GITHUB_SERVER_URL}" \
            --arg actor "${GITHUB_ACTOR}" \
            '{
              ref: $ref,
              after: $after,
              deleted: false,
              repository: {
                name: ($repository | split("/") | last),
                full_name: $repository,
                html_url: ($server_url + "/" + $repository),
                clone_url: ($server_url + "/" + $repository + ".git"),
                default_branch: "main",
                owner: {
                  login: ($repository | split("/") | first),
                  name: ($repository | split("/") | first)
                }
              },
              pusher: {
                name: $actor
              }
            }'
          )"

          ## Sign exactly the bytes that curl sends.
          signature="sha256=$(printf '%s' "${payload}" \
            | openssl dgst \
                -sha256 \
                -hmac "${KOMODO_WEBHOOK_SECRET}" \
                -hex \
            | awk '{print $NF}')"

          delivery_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT

          if http_code="$(curl \
            --silent \
            --show-error \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --connect-timeout 10 \
            --max-time 30 \
            --request POST \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Event: push' \
            --header "X-GitHub-Delivery: ${delivery_id}" \
            --header "X-Hub-Signature-256: ${signature}" \
            --data-binary "${payload}" \
            "${KOMODO_DEPLOY_WEBHOOK}")"; then

            if [[ "${http_code}" =~ ^2[0-9][0-9]$ ]]; then
              {
                echo "result=success"
                echo "detail=Komodo accepted the webhook (HTTP ${http_code})."
              } >> "${GITHUB_OUTPUT}"

              echo "Komodo accepted the deployment notification."
              exit 0
            fi

            report_warning "Komodo webhook returned HTTP ${http_code}."
            exit 1

          else
            report_warning "Komodo webhook request failed or timed out."
            exit 1
          fi

      - name: Report notification result
        if: always()
        shell: bash
        env:
          RESULT: ${{ steps.notify.outputs.result }}
          DETAIL: ${{ steps.notify.outputs.detail }}
          STEP_OUTCOME: ${{ steps.notify.outcome }}
        run: |
          {
            echo "### Komodo deployment notification"
            echo

            if [[ "${STEP_OUTCOME}" == "success" \
               && "${RESULT}" == "success" ]]; then
              echo "[SUCCESS] Webhook request accepted."
              echo
              echo "This confirms webhook acceptance, not deployment health."
            else
              echo "[WARNING] Notification was unsuccessful."
              echo
              echo "The published image is unaffected by this notification failure."
            fi

            echo
            echo "- Details: ${DETAIL:-No response details available}"
            echo "- Published commit: \`${GITHUB_SHA}\`"
            echo "- Deployment image: \`ghcr.io/redjax/dapr-xkcd:latest\`"
          } >> "${GITHUB_STEP_SUMMARY}"
